# Xiaomi Mi 9 (cepheus)
# Playback: bottom speaker, CS35L41 (mono, no speaker-protection DSP firmware) : MultiMedia1 <-> QUAT_MI2S_RX
# Capture (WCD9340 over SLIMbus) is not enabled yet: the ADSP refuses SLIMBUS_0_TX (ADSP_EALREADY).

SectionVerb {
    EnableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
        cset "name='PCM Source' ASP"
        # 0 dB digital; analog gain kept moderate because the protection DSP is not running (Xiaomi uses 17 with it)
        cset "name='Digital PCM Volume' 817"
        cset "name='Analog PCM Volume' 10"
    ]

    DisableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
    ]

    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Speaker"

    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},0"    # MultiMedia1
        PlaybackChannels 1
    }
}
